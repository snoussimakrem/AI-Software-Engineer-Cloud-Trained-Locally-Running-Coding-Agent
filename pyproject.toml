[project]
name = "ai-software-engineer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
ai-agent = "backend.cli.main:app"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["backend*"]
